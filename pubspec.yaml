name: aestheticy
description: A native Windows desktop music player.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  mpv_audio_kit: 0.5.3
  # file_picker allows picking audio files from local storage in Audio Lab.
  file_picker: 13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
